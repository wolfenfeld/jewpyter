<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:760px;display:block;margin:2rem auto;">
<defs>
  <marker id="ag"    markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#7B82A0"/></marker>
  <marker id="adqn"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#E8503A"/></marker>
  <marker id="addqn" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#4B6BFB"/></marker>
</defs>
<style>
  :root {
    --bg:       #F7F8FC;
    --surface:  #FFFFFF;
    --border:   #CDD2E4;
    --txt:      #1B1D2B;
    --sub:      #7B82A0;
    --dqn:      #E8503A;
    --dqn-fill: #FEF0EE;
    --ddqn:     #4B6BFB;
    --ddqn-fill:#EEF1FF;
    --div:      #CDD2E4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:       #1B1D2B;
      --surface:  #252838;
      --border:   #383C54;
      --txt:      #E6E8F4;
      --sub:      #8B92B0;
      --dqn-fill: #2B1E1C;
      --ddqn-fill:#1D2245;
      --div:      #383C54;
    }
  }
</style>

<rect width="760" height="500" fill="var(--bg)" rx="10"/>
<line x1="380" y1="16" x2="380" y2="484" stroke="var(--div)" stroke-width="1" stroke-dasharray="5,4"/>

<!-- ══════ DQN (left, center=190) ══════ -->
<text x="190" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="var(--dqn)" font-family="ui-monospace,monospace" letter-spacing=".08em">DQN</text>

<!-- next state -->
<rect x="110" y="48" width="160" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
<text x="190" y="69" text-anchor="middle" font-size="12" fill="var(--txt)" font-family="ui-monospace,monospace">next state  s′</text>

<line x1="190" y1="80" x2="190" y2="96" stroke="var(--sub)" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- Target network (selects) -->
<rect x="70" y="96" width="240" height="62" rx="6" fill="var(--dqn-fill)" stroke="var(--dqn)" stroke-width="1.5"/>
<text x="190" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dqn)" font-family="ui-monospace,monospace">Target Network  θ⁻</text>
<text x="120" y="131" font-size="10" fill="var(--dqn)" font-family="ui-monospace,monospace">a₁: 0.9</text>
<text x="178" y="131" font-size="10" fill="var(--dqn)" font-family="ui-monospace,monospace">a₂: 2.1</text>
<text x="236" y="131" font-size="10" fill="var(--dqn)" font-family="ui-monospace,monospace">a₃: 0.4</text>
<text x="190" y="148" text-anchor="middle" font-size="9" fill="var(--dqn)" font-family="ui-monospace,monospace" font-style="italic">Q-values for each action</text>

<line x1="190" y1="158" x2="190" y2="174" stroke="var(--sub)" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- argmax -->
<rect x="130" y="174" width="120" height="30" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
<text x="190" y="193" text-anchor="middle" font-size="11" fill="var(--txt)" font-family="ui-monospace,monospace">argmax → a₂</text>

<line x1="190" y1="204" x2="190" y2="220" stroke="var(--sub)" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- Same target network evaluates -->
<rect x="70" y="220" width="240" height="50" rx="6" fill="var(--dqn-fill)" stroke="var(--dqn)" stroke-width="1.5"/>
<text x="190" y="238" text-anchor="middle" font-size="11" font-weight="600" fill="var(--dqn)" font-family="ui-monospace,monospace">Target Network  θ⁻  (same)</text>
<text x="190" y="258" text-anchor="middle" font-size="10" fill="var(--dqn)" font-family="ui-monospace,monospace">Q(s′, a₂; θ⁻) = 2.1  ← target</text>

<!-- warning badge -->
<rect x="84" y="282" width="212" height="24" rx="4" fill="var(--dqn)" opacity=".12"/>
<text x="190" y="298" text-anchor="middle" font-size="10" fill="var(--dqn)" font-weight="600" font-family="ui-monospace,monospace">⚠ selected AND scored by θ⁻</text>

<line x1="190" y1="306" x2="190" y2="322" stroke="var(--sub)" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- target value -->
<rect x="100" y="322" width="180" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
<text x="190" y="343" text-anchor="middle" font-size="13" fill="var(--txt)" font-family="ui-monospace,monospace">y = r + γ · 2.1</text>

<text x="190" y="390" text-anchor="middle" font-size="10" fill="var(--sub)" font-family="ui-monospace,monospace">noisy max inflates the target</text>


<!-- ══════ DOUBLE DQN (right, center=570) ══════ -->
<text x="570" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ddqn)" font-family="ui-monospace,monospace" letter-spacing=".08em">DOUBLE DQN</text>

<!-- next state -->
<rect x="490" y="48" width="160" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
<text x="570" y="69" text-anchor="middle" font-size="12" fill="var(--txt)" font-family="ui-monospace,monospace">next state  s′</text>

<line x1="570" y1="80" x2="570" y2="96" stroke="var(--sub)" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- Main network selects -->
<rect x="450" y="96" width="240" height="62" rx="6" fill="var(--ddqn-fill)" stroke="var(--ddqn)" stroke-width="1.5"/>
<text x="570" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ddqn)" font-family="ui-monospace,monospace">Main Network  θ  (selects)</text>
<text x="500" y="131" font-size="10" fill="var(--ddqn)" font-family="ui-monospace,monospace">a₁: 1.1</text>
<text x="558" y="131" font-size="10" fill="var(--ddqn)" font-family="ui-monospace,monospace">a₂: 1.8</text>
<text x="616" y="131" font-size="10" fill="var(--ddqn)" font-family="ui-monospace,monospace">a₃: 0.6</text>
<text x="570" y="148" text-anchor="middle" font-size="9" fill="var(--ddqn)" font-family="ui-monospace,monospace" font-style="italic">Q-values for each action</text>

<line x1="570" y1="158" x2="570" y2="174" stroke="var(--sub)" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- argmax -->
<rect x="510" y="174" width="120" height="30" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
<text x="570" y="193" text-anchor="middle" font-size="11" fill="var(--txt)" font-family="ui-monospace,monospace">argmax → a₂</text>

<line x1="570" y1="204" x2="570" y2="220" stroke="var(--sub)" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- Target network evaluates -->
<rect x="450" y="220" width="240" height="50" rx="6" fill="var(--ddqn-fill)" stroke="var(--ddqn)" stroke-width="1.5"/>
<text x="570" y="238" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ddqn)" font-family="ui-monospace,monospace">Target Network  θ⁻  (evaluates)</text>
<text x="570" y="258" text-anchor="middle" font-size="10" fill="var(--ddqn)" font-family="ui-monospace,monospace">Q(s′, a₂; θ⁻) = 1.3  ← target</text>

<!-- check badge -->
<rect x="464" y="282" width="212" height="24" rx="4" fill="var(--ddqn)" opacity=".12"/>
<text x="570" y="298" text-anchor="middle" font-size="10" fill="var(--ddqn)" font-weight="600" font-family="ui-monospace,monospace">✓ independent networks, errors differ</text>

<line x1="570" y1="306" x2="570" y2="322" stroke="var(--sub)" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- target value -->
<rect x="480" y="322" width="180" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
<text x="570" y="343" text-anchor="middle" font-size="13" fill="var(--txt)" font-family="ui-monospace,monospace">y = r + γ · 1.3</text>

<text x="570" y="390" text-anchor="middle" font-size="10" fill="var(--sub)" font-family="ui-monospace,monospace">calmer target, more stable training</text>

<!-- caption -->
<text x="380" y="450" text-anchor="middle" font-size="10" fill="var(--sub)" font-family="ui-monospace,monospace">Both pick a₂, but the evaluation comes from a different network — so noise doesn't compound.</text>
</svg>
